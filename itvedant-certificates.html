<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IT Vedant Certificates</title>

    <style>
        body {
            font-family: Arial;
            background: #f8f9fc;
            margin: 0;
        }
        
        .container {
            width: 90%;
            margin: 50px auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .grid img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
            transition: .3s;
        }
        
        .grid img:hover {
            transform: scale(1.03);
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>My IT Vedant Certificates</h1>

        <div class="grid">

            <img src="images/cce_certificate29101___1781331564.jpg" alt="CCE Certificate">

            <img src="images/advancedexcel_247_1762184514.jpg" alt="Advanced Excel Certificate">

            <img src="images/analysiswithpython_253_1777122353__1777122358.jpg" alt="Analysis with Python Certificate">

            <img src="images/divingintotheworldofdatadwd_252_1777122279__1777122302.jpg" alt="Diving into the World of Data Certificate">

            <img src="images/machinelearningmastery_279_1780468853__1780468859.jpg" alt="Machine Learning Mastery Certificate">

            <img src="images/powerbiessentials_244_1766674755.jpg" alt="Power BI Essentials Certificate">

            <img src="images/Python analysis _ crtificate.jpg" alt="Python Analysis Certificate">

            <img src="images/sqlmastery_273_1762184538.jpg" alt="SQL Mastery Certificate">

            <img src="images/tableau_certificate.jpg" alt="Tableau Certificate">
        </div>

    </div>

</body>

</html>
