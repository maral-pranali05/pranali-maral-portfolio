<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fc;
            margin: 0;
        }
        
        .container {
            width: 90%;
            margin: 50px auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .grid img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
            transition: .3s;
        }
        
        .grid img:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Link_women_project_Certificates</h1>

        <div class="grid">

            <img src="images/linked women soft skill project certificate.jpeg">









        </div>

    </div>

</body>

</html>
